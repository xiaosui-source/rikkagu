# Gradle 使用流水线提供的 JAVA_HOME（不在此写死路径，避免 CI 容器路径差异导致失败）
org.gradle.java.installations.auto-download=false
# ===== 一加13 极限编译配置（16G RAM / 8核 / CodeAssist）=====
# 模块并行构建（8 核设备收益明显）
org.gradle.parallel=true
# 构建缓存：跨构建复用任务输出
org.gradle.caching=true
# 配置缓存：与 AGP 9.1.1 打包任务不兼容，已关闭
# org.gradle.configuration-cache=true
# Kotlin / KSP 增量编译（第二次起大幅提速）
kotlin.incremental=true
ksp.incremental=true
# 8 核：worker 数匹配
org.gradle.workers.max=8
org.gradle.daemon=true
# 16G 运存：给足内存，避免 Kotlin FIR 解析 OOM
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m
