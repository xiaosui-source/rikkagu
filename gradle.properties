# Gradle 使用流水线提供的 JAVA_HOME（不在此写死路径，避免 CI 容器路径差异导致失败）
org.gradle.java.installations.auto-download=false
# ===== 构建调优参数（默认值适合通用 CI / 8 核 16G 机器）=====
# 提示：若在你自己的低配机器上 OOM / 卡顿，可用环境变量或命令行属性覆盖，例如:
#   export GRADLE_OPTS="-Xmx2g -Dfile.encoding=UTF-8" 后运行
# 或 ./gradlew assembleRelease -PmaxWorkers=4
# 显式指定文件编码，保证中文/多语言资源编译一致（平台无关）
org.gradle.jvmargs=-Dfile.encoding=UTF-8
org.gradle.parallel=true
# 构建缓存：跨构建复用任务输出
org.gradle.caching=true
# 配置缓存：与 AGP 9.1.1 打包任务不兼容，已关闭
# org.gradle.configuration-cache=true
kotlin.incremental=true
ksp.incremental=true
