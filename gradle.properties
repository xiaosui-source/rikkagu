# Gradle 使用流水线提供的 JAVA_HOME（不在此写死路径，避免 CI 容器路径差异导致失败）
org.gradle.java.installations.auto-download=false
# ===== 构建速度优化（容器 2 核 / 4Gi）=====
# 模块并行构建（9 个模块，收益明显）
org.gradle.parallel=true
# 构建缓存：跨构建复用任务输出
org.gradle.caching=true
# 配置缓存：与 AGP 9.1.1 打包任务不兼容（会导致输出到根目录 EROFS），已关闭
# org.gradle.configuration-cache=true
# Kotlin / KSP 增量编译
kotlin.incremental=true
ksp.incremental=true
# 2 核容器：worker 数匹配 CPU
org.gradle.workers.max=2
org.gradle.daemon=true
# 容器仅 4Gi：压缩 Gradle JVM 与 Kotlin daemon 内存，避免 app 模块编译 OOM
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m
