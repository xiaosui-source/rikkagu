version: "1.0"
name: 构建
displayName: 构建
stages:
  - name: 构建
    displayName: 构建
    strategy: naturally
    trigger: auto
    steps:
      - step: build@android
        name: ""
        displayName: Android 构建
        # 使用容器中实际存在的 JDK 17
        jdkVersion: "17"
        gradleVersion: "9.0"
        buildToolsVersion: 35.0.1
        ndkVersion: 28.2.13676358
        # 自动触发（无需手动点 Run）
        trigger: auto
        commands:
          # 基础环境
          - set -euo pipefail
          - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
          - export PATH=$JAVA_HOME/bin:$PATH
          - export ANDROID_HOME=/opt/android-sdk

          # 1️⃣ 下载 Gradle（优先使用国内镜像）
          - |
            echo "##[section]Downloading Gradle 9.4.1 (prefer mirror)"
            if [ -f gradle-9.4.1-bin.zip ]; then
              echo "Found cached Gradle zip, skipping download"
            else
              MIRROR_URL="https://mirrors.tuna.tsinghua.edu.cn/gradle/gradle-9.4.1-bin.zip"
              OFFICIAL_URL="https://services.gradle.org/distributions/gradle-9.4.1-bin.zip"
              echo "Trying mirror: $MIRROR_URL"
              curl -L --fail --retry 3 --max-time 600 -o gradle-9.4.1-bin.zip $MIRROR_URL && echo "Downloaded from mirror"
              if [ $? -ne 0 ]; then
                echo "Mirror failed, falling back to official URL"
                curl -L --fail --retry 3 --max-time 600 -o gradle-9.4.1-bin.zip $OFFICIAL_URL || {
                  echo "Both mirror and official download failed → will use system gradle (4.4.1)"
                }
              fi
            fi

          # 2️⃣ 解压 Gradle（如果下载成功）并决定使用哪个 Gradle 命令
          - chmod +x gradlew
          - export GRADLE_CMD="gradle"          # 默认使用系统 gradle (4.4.1)
          - |
            if [ -f gradle-9.4.1-bin.zip ]; then
              echo "Unzipping Gradle 9.4.1"
              unzip -qo gradle-9.4.1-bin.zip -d $HOME/.gradle/wrapper/dists/
              export GRADLE_CMD="./gradlew"
            else
              echo "Using system gradle (4.4.1) as fallback"
            fi

          # 3️⃣ 确保 Android SDK / cmdline‑tools 存在（若缺失则自动下载）
          - |
            # If the SDK directory does not exist, create it
            if [ ! -d "$ANDROID_HOME" ]; then
              mkdir -p "$ANDROID_HOME"
            fi

            # If cmdline‑tools are missing, download them
            if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
              echo "Downloading Android cmdline‑tools..."
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              curl -L --fail --retry 3 --max-time 600 -o cmdline-tools.zip \
                https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip && \
              unzip -qo cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools" && \
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" && \
              rm -f cmdline-tools.zip
            fi

            # Install required platform / build‑tools / ndk
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
              "platforms;android-37" \
              "build-tools;35.0.1" \
              "ndk;28.2.13676358"

          # 4️⃣ 运行 Gradle 构建（统一使用 $GRADLE_CMD）
          - echo "##[section]Running Gradle clean"
          - $GRADLE_CMD -Dorg.gradle.java.home=/usr/lib/jvm/java-17-openjdk --no-daemon clean

          - echo "##[section]Running Gradle assembleRelease"
          - $GRADLE_CMD -Dorg.gradle.java.home=/usr/lib/jvm/java-17-openjdk --no-daemon \
              --parallel --max-workers=4 \
              :app:assembleRelease --stacktrace \
              || { echo "Gradle build failed"; exit 1; }
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./app/build/outputs/apk/release
            type: .tar.gz
        caches:
          - "~/.gradle"
          - "~/.android"
          - "~/.m2"

triggers:
  push:
    branches:
      - "**"
  manual: {}

notify: []

strategy:
  blocking: true