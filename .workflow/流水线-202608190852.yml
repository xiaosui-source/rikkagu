version: "1.0"
name: 构建
displayName: 构建
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@android
    trigger: auto
    name: ""
    displayName: Android 构建
    # 使用容器中实际存在的 JDK 17
    jdkVersion: "17"
    gradleVersion: "9.0"
    buildToolsVersion: 35.0.1
    ndkVersion: 28.2.13676358
    commands:
    - set -euo pipefail
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
    - export PATH=$JAVA_HOME/bin:$PATH
    - echo "##[section]Downloading Gradle 9.4.1"
    - if [ ! -f gradle-9.4.1-bin.zip ]; then
  echo "Downloading Gradle 9.4.1";
  curl -L --fail --retry 3 --max-time 600 -o gradle-9.4.1-bin.zip https://services.gradle.org/distributions/gradle-9.4.1-bin.zip || {
    echo "Download failed, using bundled Gradle";
    echo "No bundled Gradle found, will use system gradle";
  }
fi
    - rm -rf $HOME/.gradle/wrapper/dists/gradle-9.4.1*
    - unzip -qo gradle-9.4.1-bin.zip -d $HOME/.gradle/wrapper/dists/
    - echo "##[section]Installing Android SDK components"
    - yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-37" "build-tools;35.0.1" "ndk;28.2.13676358"
    - echo "##[section]Ensuring gradlew is executable"
    - chmod +x gradlew
    - export GRADLE_CMD="gradle"
    - if [ -f gradle-9.4.1-bin.zip ]; then
        unzip -qo gradle-9.4.1-bin.zip -d $HOME/.gradle/wrapper/dists/
        export GRADLE_CMD="./gradlew"
      fi
    - echo "##[section]Running Gradle build"
    - $GRADLE_CMD -Dorg.gradle.java.home=/usr/lib/jvm/java-17-openjdk --no-daemon clean
    - $GRADLE_CMD -Dorg.gradle.java.home=/usr/lib/jvm/java-17-openjdk --no-daemon :app:assembleRelease --stacktrace || { echo "Gradle build failed"; exit 1; }
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./app/build/outputs/apk/release
      type: .tar.gz
    caches:
    - "~/.gradle"
    - "~/.android"
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  push:
    branches:
      - "**"
  manual: {}
notify: []
strategy:
  blocking: true
