name: Build Clean APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install prerequisites (JDK, unzip, wget)
        run: |
          sudo apt-get update && sudo apt-get install -y unzip default-jdk wget

      - name: Install apktool & aapt2
        run: |
          wget -O /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          chmod +x /tmp/apktool.jar
          sudo mkdir -p /opt/android-sdk/build-tools/34.0.0
          wget -qO- https://dl.google.com/android/repository/build-tools_r34.0.0-linux.zip | unzip -q -d /opt/android-sdk/build-tools/34.0.0

      - name: Decode base.apk
        run: |
          mkdir -p work
          cp base.apk work/
          java -jar /tmp/apktool.jar d work/base.apk -o work/jxzl-src

      - name: Rebuild APK (unsigned)
        run: |
          java -jar /tmp/apktool.jar b work/jxzl-src -o work/jxzl-patched-unsigned.apk

      - name: Zipalign
        run: |
          /opt/android-sdk/build-tools/34.0.0/zipalign -p 4 work/jxzl-patched-unsigned.apk work/jxzl-patched-aligned.apk

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Sign APK
        run: |
          /opt/android-sdk/build-tools/34.0.0/apksigner sign \
            --ks debug.keystore --ks-pass pass:android \
            --key-pass pass:android \
            --out clean.apk work/jxzl-patched-aligned.apk

artifacts:
  - name: clean-apk
    path: clean.apk
