name: Android Build Workflow

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KEYSTORE_PASSWORD: Abc123456789@xyz
  KEY_ALIAS: auto_key
  KEY_PASSWORD: Abc123456789@xyz

jobs:
  Release_Build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 缓存 Android SDK 组件(platforms/build-tools), 避免每次重新下载 compileSdk 平台
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/ndk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      # 缓存 Gradle 依赖与 wrapper (setup-java 已含, 这里显式兜底, 加快后续构建)
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      - name: Generate & Save Keystore
        run: |
          if [ ! -f "app/release-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore "app/release-key.jks" \
              -alias "auto_key" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ env.KEYSTORE_PASSWORD }}" \
              -keypass "${{ env.KEY_PASSWORD }}" \
              -dname "CN=Android App,OU=Dev,O=Company,L=City,ST=Province,C=CN"

            git config --global user.name "Github Actions Bot"
            git config --global user.email "actions@github.com"
            git add app/release-key.jks
            git commit -m "Auto save keystore file, reuse next build"
            git push
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease -x lint -x lintVitalRelease --console=plain -q --max-workers=4
        env:
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK
          path: app/build/outputs/apk/release/*.apk

  Debug_Build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 缓存 Android SDK 组件
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/ndk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      # 缓存 Gradle 依赖
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      - name: Generate & Save Keystore
        run: |
          if [ ! -f "app/release-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore "app/release-key.jks" \
              -alias "auto_key" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ env.KEYSTORE_PASSWORD }}" \
              -keypass "${{ env.KEY_PASSWORD }}" \
              -dname "CN=Android App,OU=Dev,O=Company,L=City,ST=Province,C=CN"

            git config --global user.name "Github Actions Bot"
            git config --global user.email "actions@github.com"
            git add app/release-key.jks
            git commit -m "Auto save keystore file, reuse next build"
            git push
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --console=plain -q --max-workers=4

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APK
          path: app/build/outputs/apk/debug/*.apk
