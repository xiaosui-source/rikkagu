name: Android Build Workflow

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KEYSTORE_PASSWORD: Abc123456789@xyz
  KEY_ALIAS: auto_key
  KEY_PASSWORD: Abc123456789@xyz

jobs:
  Release_Build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Switch wrapper to official mirror
        run: sed -i 's#https\\://mirrors.cloud.tencent.com/gradle/#https://services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties

      - name: Ensure Android SDK 37
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-37" "build-tools;36.0.0" >/dev/null 2>&1 || echo "sdkmanager failed, AGP will auto-install"
          fi

      - name: Generate & Save Keystore
        run: |
          if [ ! -f "app/release-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore "app/release-key.jks" \
              -alias "auto_key" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ env.KEYSTORE_PASSWORD }}" \
              -keypass "${{ env.KEY_PASSWORD }}" \
              -dname "CN=Android App,OU=Dev,O=Company,L=City,ST=Province,C=CN"
            git config --global user.name "Github Actions Bot"
            git config --global user.email "actions@github.com"
            git add app/release-key.jks
            git commit -m "Auto save keystore file, reuse next build [skip ci]"
            git push
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease -x lint -x lintVitalRelease --console=plain -q --max-workers=4
        env:
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: Release-APK
          path: app/build/outputs/apk/release/*.apk

  Debug_Build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Switch wrapper to official mirror
        run: sed -i 's#https\\://mirrors.cloud.tencent.com/gradle/#https://services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties

      - name: Ensure Android SDK 37
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-37" "build-tools;36.0.0" >/dev/null 2>&1 || echo "sdkmanager failed, AGP will auto-install"
          fi

      - name: Generate & Save Keystore
        run: |
          if [ ! -f "app/release-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore "app/release-key.jks" \
              -alias "auto_key" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ env.KEYSTORE_PASSWORD }}" \
              -keypass "${{ env.KEY_PASSWORD }}" \
              -dname "CN=Android App,OU=Dev,O=Company,L=City,ST=Province,C=CN"
            git config --global user.name "Github Actions Bot"
            git config --global user.email "actions@github.com"
            git add app/release-key.jks
            git commit -m "Auto save keystore file, reuse next build [skip ci]"
            git push
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --console=plain -q --max-workers=4

      - uses: actions/upload-artifact@v4
        with:
          name: Debug-APK
          path: app/build/outputs/apk/debug/*.apk
